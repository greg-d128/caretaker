name: Caretaker CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --yes gnupg

      - name: Install Caretaker and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,signing]'

      - name: Compile source, tests, and examples
        run: python -m compileall -q src tests examples

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
