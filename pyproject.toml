[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Caretaker"
version = "0.6.1"
description = "Policy-driven runtime observation, analysis, repair, and integrity framework for Python applications"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Grzegorz Dostatni"}]
keywords = [
  "runtime-observation",
  "self-repair",
  "application-monitoring",
  "runtime-integrity",
  "software-assurance",
  "python",
]
dependencies = ["textual>=0.80"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=5"]
signing = ["cryptography>=42"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "repository: tests that require files from the source repository rather than the installed package",
]

[project.scripts]
caretaker-integrity = "caretaker.integrity.cli:main"
caretaker-guard = "caretaker.guard.cli:main"
caretaker-logging = "caretaker.logging.cli:main"
caretaker-run = "caretaker.run:main"
caretaker-console = "caretaker.console:main"
caretaker-capsule-explorer = "caretaker.capsule_cli:main"
caretaker-incident-draft = "caretaker.communication_cli:main"
caretaker-incident-review = "caretaker.communication_review_cli:main"
caretaker-regression-fixtures = "caretaker.regression_cli:main"
caretaker-profile = "caretaker.profile_cli:main"
